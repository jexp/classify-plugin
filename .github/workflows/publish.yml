name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write   # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    runs-on: ubuntu-latest
    needs: test
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false # never use caching in release builds
      - run: npm ci
      # npm >= 11.5.1 required for trusted publishing; Node 24 ships npm 11.x,
      # upgrade to be safe
      - run: npm install -g npm@latest
      # provenance is generated automatically with trusted publishing (public repo + public package)
      - run: npm publish --access public
